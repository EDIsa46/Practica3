name: Ejecutar Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        ref: master
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Ejecutar Tests Específicos
      run: cd Practica3 && mvn test -Dtest=Cucumber.RunCucumberTest,Cucumber.RunCucumberTestTDD,Prestamo.Cucumber.PrestamoMockitoTest,Prestamo.Cucumber.PrestamoTest
